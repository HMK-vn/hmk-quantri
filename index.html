// Trang GitHub Pages chỉ là khung: mở web quản trị (Apps Script) toàn màn hình, chuyển tiếp ?tab=…&quan=…&ngay=…

f.src = WEB + location.search; f.allow = "clipboard-write; camera";

document.body.appendChild(f);
